receptor_arrays_note: 'Receptor arrays occur for both mating and non-mating STE3-like
  receptors (the study found arrays holding paralogs beside the mating receptors in
  Coprinopsis cinerea and Schizophyllum commune), so array membership does not establish
  that a locus is a mating receptor. receptor_array_support is a flag on the evidence
  behind an array; it never changes a call, its confidence or its verification label.
  receptor_cassette_* fields describe pheromone-precursor cassette structure (2 or
  more strict-CAAX ORFs within 5 kb of a receptor locus; class C when that many of
  those ORFs also carry tblastn precursor homology). They are descriptive only: the
  CAAX scan is also what admits a PR call, so cassettes are circular as confirmation;
  own-species curated precursors are a self-hit for class C; tandem receptors may
  be merged into one locus. They never change a call, tier, label, confidence or count.'
